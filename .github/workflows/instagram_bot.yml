name: Bot Instagram Automático

on:
  workflow_dispatch:
    inputs:
      tipo_post:
        description: 'Tipo de postagem para rodar manualmente'
        required: true
        type: choice
        options:
          - story
          - story_manha
          - story_tarde
          - carousel
          - reels
          - pexels_story
          - reels_noite
          - pexels_story_noite
          - reels_conquistador
          - reels_leads
          - comentarios
          - gerador_pdf
          - analytics
          - weekly_report
          - mensal
          - trimestral
          - semestral
          - user_requests
          - test

  schedule:
    # 04:00 BRT - Coleta diária de métricas
    - cron: '0 7 * * *'
    # 08:00 BRT toda segunda - Olhos da Rede semanal
    - cron: '0 11 * * 1'
    # 08:30 BRT toda segunda - Analisador + IA estrategista
    - cron: '30 11 * * 1'

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Checkout do Repositório de PDFs (Valores do PAI)
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: criptodash52/pdf_trabalhador2
          token: ${{ secrets.GH_PAT_PDF_UPLOAD }}
          path: gerador_pdf/repositorio_pdfs

      - name: Checkout do Repositório de PDFs (gustavo_8k)
        uses: actions/checkout@v4
        with:
          repository: gustavocapichoni/gustavo_8k
          token: ${{ secrets.GH_PAT_PDF_UPLOAD }}
          path: gerador_pdf/repositorio_pdfs

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar Dependências (APT)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick

      - name: Corrigir política de segurança do ImageMagick
        run: |
          sudo sed -i 's/rights="none" pattern="@\*"/rights="read|write" pattern="@*"/' /etc/ImageMagick-6/policy.xml || true
          sudo sed -i 's/<policy domain="path" rights="none" pattern="@\*"\/>/<policy domain="path" rights="read|write" pattern="@*"\/>/' /etc/ImageMagick-6/policy.xml || true

      - name: Instalar Dependências (PIP)
        run: pip install -r requirements.txt

      - name: Criar arquivo de variáveis (.env)
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$ENV_FILE" ]; then
            echo "$ENV_FILE" > .env
          fi

      - name: Criar arquivos de credenciais das redes (YouTube)
        env:
          YOUTUBE_CLIENT_SECRETS_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          [ -n "$YOUTUBE_CLIENT_SECRETS_JSON" ] && echo "$YOUTUBE_CLIENT_SECRETS_JSON" > client_secrets.json || true
          [ -n "$YOUTUBE_TOKEN_JSON" ] && echo "$YOUTUBE_TOKEN_JSON" > token_youtube.json || true

      - name: Executar Bot (Agendado)
        if: github.event_name == 'schedule'
        env:
          POSTAR_NO_YOUTUBE: ${{ secrets.POSTAR_NO_YOUTUBE }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          IG_ACCESS_TOKEN_2: ${{ secrets.IG_ACCESS_TOKEN_2 }}
          IG_ACCOUNT_ID_2: ${{ secrets.IG_ACCOUNT_ID_2 }}
          IG_ACCESS_TOKEN_9: ${{ secrets.IG_ACCESS_TOKEN_9 }}
          IG_ACCOUNT_ID_9: ${{ secrets.IG_ACCOUNT_ID_9 }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_API_KEY_2: ${{ secrets.ELEVENLABS_API_KEY_2 }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_VOICE_ID_2: ${{ secrets.ELEVENLABS_VOICE_ID_2 }}
        run: python rodar_via_cron.py

      - name: Executar Bot (Manual)
        if: github.event_name == 'workflow_dispatch'
        env:
          POSTAR_NO_YOUTUBE: ${{ secrets.POSTAR_NO_YOUTUBE }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          IG_ACCESS_TOKEN_2: ${{ secrets.IG_ACCESS_TOKEN_2 }}
          IG_ACCOUNT_ID_2: ${{ secrets.IG_ACCOUNT_ID_2 }}
          IG_ACCESS_TOKEN_9: ${{ secrets.IG_ACCESS_TOKEN_9 }}
          IG_ACCOUNT_ID_9: ${{ secrets.IG_ACCOUNT_ID_9 }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_API_KEY_2: ${{ secrets.ELEVENLABS_API_KEY_2 }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_VOICE_ID_2: ${{ secrets.ELEVENLABS_VOICE_ID_2 }}
        run: python rodar_via_cron.py --manual ${{ github.event.inputs.tipo_post }}

      - name: Salvar Estado do Bot
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add gerador_pdf/output/ultimo_conteudo.json estado_migrado.json analytics/dados/recomendacoes.json analytics/dados/memoria_estrategica.json || true
          git diff --staged --quiet || git commit -m "chore: atualizar estado [skip ci]"
          git pull --rebase -X theirs origin main || true
          git push
